name: Backend Docker smoke test

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'chat-1/gesto-ai/backend/Dockerfile'
      - 'chat-1/gesto-ai/backend/requirements.txt'
      - 'chat-1/gesto-ai/backend/main.py'
      - 'chat-1/gesto-ai/backend/sentence_gen.py'
      - '.github/workflows/backend-docker-smoke.yml'

permissions:
  contents: read

jobs:
  docker:
    name: Build image and hit /health
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Build the backend image
        working-directory: chat-1/gesto-ai/backend
        run: |
          docker build -t gesto-backend . > /tmp/build.log 2>&1
          tail -12 /tmp/build.log
          docker image ls gesto-backend --format 'image {{.Size}}'

      - name: Run the container with an injected PORT
        run: |
          set +e
          docker rm -f gesto >/dev/null 2>&1
          docker run -d --name gesto -p 8080:8080 -e PORT=8080 gesto-backend > /tmp/run.log 2>&1
          for i in $(seq 1 40); do
            sleep 5
            code=$(curl -s -o /tmp/health -w '%{http_code}' --max-time 5 http://localhost:8080/health)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' gesto 2>/dev/null)" != "true" ]; then
              echo "container exited"
              break
            fi
          done
          echo "--- /health body ---"
          head -c 900 /tmp/health
          docker logs gesto > /tmp/clogs 2>&1
          echo "--- container logs (tail) ---"
          tail -20 /tmp/clogs

      - name: Judge the result
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          def lines(path):
              try:
                  return pathlib.Path(path).read_text(encoding='utf-8', errors='replace').splitlines()
              except OSError:
                  return []

          logs = lines('/tmp/clogs')
          for line in logs[-18:]:
              text = line.replace('%', '%25').strip()
              if text:
                  print('::warning::' + text[:700])

          try:
              health = json.loads(pathlib.Path('/tmp/health').read_text(encoding='utf-8'))
          except Exception:
              for line in lines('/tmp/clogs')[-12:]:
                  print('::error::' + line.replace('%', '%25').strip()[:800])
              print('::error::/health never returned JSON — container crashed or never bound PORT')
              raise SystemExit(1)

          if not health.get('model_loaded'):
              print('::error::/health returned model_loaded=false')
              raise SystemExit(1)

          labels = health.get('gesture_labels', [])
          print(f"::notice::OK: model_loaded=true, {len(labels)} gesture classes, PORT honoured")
          PY
