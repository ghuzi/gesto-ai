name: Build Android APK

on:
  push:
    branches: [main, arena/2350a3d7-gesto-ai]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Attach the APKs to a GitHub Release (easy download link)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Flutter build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > "$RUNNER_TEMP/analyze.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/analyze.txt"
          if [ $status -ne 0 ]; then
            python3 - "$RUNNER_TEMP/analyze.txt" <<'PY'
          import sys

          with open(sys.argv[1], encoding='utf-8', errors='replace') as fh:
              lines = fh.read().splitlines()
          for line in lines:
              text = line.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              if ' error ' in text or 'error •' in text or 'Error:' in text:
                  print('::error::' + text.strip()[:900])
          PY
          fi
          exit $status

      - name: Build universal release APK
        run: |
          set +e
          flutter build apk --release > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/build.log"
          if [ $status -ne 0 ]; then
            python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import sys

          with open(sys.argv[1], encoding='utf-8', errors='replace') as fh:
              lines = fh.read().splitlines()
          for line in lines[-30:]:
              text = line.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              if text.strip():
                  print('::error::' + text)
          PY
            exit $status
          fi
          exit 0

      - name: Build per-ABI release APKs
        run: |
          set +e
          flutter build apk --release --split-per-abi > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/build.log"
          if [ $status -ne 0 ]; then
            python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import sys

          with open(sys.argv[1], encoding='utf-8', errors='replace') as fh:
              lines = fh.read().splitlines()
          for line in lines[-30:]:
              text = line.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              if text.strip():
                  print('::error::' + text)
          PY
            exit $status
          fi
          exit 0

      - name: Collect APKs
        run: |
          set -e
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk                    ../artifacts/gesto-ai-1.0.0-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk        ../artifacts/gesto-ai-1.0.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk          ../artifacts/gesto-ai-1.0.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk             ../artifacts/gesto-ai-1.0.0-x86_64.apk
          ls -lh ../artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gesto-ai-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0-${{ github.run_number }}
          name: Gesto AI for Android — v1.0.0 (build ${{ github.run_number }})
          body: |
            ## Gesto AI — Android APK

            Pakistan Sign Language → Urdu speech, on your phone.

            | File | Use it for |
            | --- | --- |
            | `gesto-ai-1.0.0-universal.apk` | Any Android phone (safest choice) |
            | `gesto-ai-1.0.0-arm64-v8a.apk` | Modern 64-bit phones (smaller download) |
            | `gesto-ai-1.0.0-armeabi-v7a.apk` | Older 32-bit phones |
            | `gesto-ai-1.0.0-x86_64.apk` | Emulators |

            **Install:** enable "Install unknown apps" for your browser/file manager,
            then open the APK. Android 7.0 or newer is required.

            The app talks to the Railway backend (`https://gesto-ai-production.up.railway.app`).
            You can point it at any other server in **Settings → Backend server**.
          files: artifacts/*.apk
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          {
            echo "## Gesto AI APK"
            echo ""
            echo "| APK | Size |"
            echo "| --- | --- |"
            for f in ../artifacts/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
