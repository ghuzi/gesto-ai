name: Build Android APK

on:
  push:
    branches: [main, 'arena/**']
    tags: ['android-v*']
    paths:
      - 'chat-1/gesto-ai/mobile/**'
      - '.github/workflows/mobile-apk.yml'
  pull_request:
    paths:
      - 'chat-1/gesto-ai/mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Attach the APKs to a GitHub Release (easy download link)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Flutter build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-1/gesto-ai/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        run: |
          line=$(grep -E '^version:' pubspec.yaml | head -1)
          version=$(echo "$line" | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1)
          build=$(echo "$line" | sed -E 's/.*\+//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "::notice::Building Gesto AI Android $version+$build"

      - name: Static analysis
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > "$RUNNER_TEMP/analyze.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/analyze.txt"
          if [ $status -ne 0 ]; then
            python3 - "$RUNNER_TEMP/analyze.txt" <<'PY'
          import sys

          with open(sys.argv[1], encoding='utf-8', errors='replace') as fh:
              lines = fh.read().splitlines()
          for line in lines:
              text = line.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              if ' error ' in text or 'error •' in text or 'Error:' in text:
                  print('::error::' + text.strip()[:900])
          PY
          fi
          exit $status

      - name: Build universal release APK
        env:
          # Optional: Settings → Variables → GESTO_API_BASE = https://your-backend
          API_BASE: ${{ vars.GESTO_API_BASE }}
        run: |
          set +e
          ARGS=""
          if [ -n "$API_BASE" ]; then
            ARGS="--dart-define=GESTO_API_BASE=$API_BASE"
            echo "Baking backend URL: $API_BASE"
          fi
          flutter build apk --release $ARGS > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/build.log"
          if [ $status -ne 0 ]; then
            python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import sys

          with open(sys.argv[1], encoding='utf-8', errors='replace') as fh:
              lines = fh.read().splitlines()
          for line in lines[-30:]:
              text = line.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              if text.strip():
                  print('::error::' + text)
          PY
            exit $status
          fi
          exit 0

      - name: Build per-ABI release APKs
        env:
          API_BASE: ${{ vars.GESTO_API_BASE }}
        run: |
          set +e
          ARGS=""
          if [ -n "$API_BASE" ]; then
            ARGS="--dart-define=GESTO_API_BASE=$API_BASE"
          fi
          flutter build apk --release --split-per-abi $ARGS > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/build.log"
          if [ $status -ne 0 ]; then
            python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import sys

          with open(sys.argv[1], encoding='utf-8', errors='replace') as fh:
              lines = fh.read().splitlines()
          for line in lines[-30:]:
              text = line.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              if text.strip():
                  print('::error::' + text)
          PY
            exit $status
          fi
          exit 0

      - name: Collect APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          out="$GITHUB_WORKSPACE/artifacts"
          cp build/app/outputs/flutter-apk/app-release.apk            "$out/gesto-ai-$VERSION-universal.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$out/gesto-ai-$VERSION-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "$out/gesto-ai-$VERSION-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "$out/gesto-ai-$VERSION-x86_64.apk"
          ls -lh "$out"

      - name: Verify APK signatures
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using $BT"
          for f in "$GITHUB_WORKSPACE"/artifacts/*.apk; do
            echo "=== $(basename "$f") ==="
            "$BT/apksigner" verify --print-certs "$f" | head -5
            echo "::notice::$(basename "$f") | $("$BT/aapt2" dump badging "$f" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion)' | tr '\n' ' ')"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gesto-ai-apk-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.make_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || format('android-v{0}-{1}', steps.version.outputs.version, github.run_number) }}
          name: Gesto AI for Android — v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## Gesto AI — Android APK v${{ steps.version.outputs.version }}

            Pakistan Sign Language → Urdu speech, on your phone.

            | File | Use it for |
            | --- | --- |
            | `gesto-ai-${{ steps.version.outputs.version }}-arm64-v8a.apk` | Modern 64-bit phones (smallest download) |
            | `gesto-ai-${{ steps.version.outputs.version }}-universal.apk` | Any Android phone (safest) |
            | `gesto-ai-${{ steps.version.outputs.version }}-armeabi-v7a.apk` | Older 32-bit phones |
            | `gesto-ai-${{ steps.version.outputs.version }}-x86_64.apk` | Emulators |

            **Install:** allow "Install unknown apps" for your browser, then open the APK.
            Android 7.0+ required.

            **Backend address:** if the server is unreachable, open the app →
            **Home → Server status → Change server** (or **Settings → Backend server**)
            and enter a live endpoint, e.g. a fresh Railway deploy or
            `http://<laptop-ip>:8000` on the same Wi-Fi.
          files: artifacts/*.apk
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          {
            echo "## Gesto AI APK v${{ steps.version.outputs.version }}"
            echo ""
            echo "| APK | Size |"
            echo "| --- | --- |"
            for f in "$GITHUB_WORKSPACE"/artifacts/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
