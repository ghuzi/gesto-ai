name: Generate debug keystore

# One-off helper: prints a stable debug keystore (base64) as annotations so it
# can be committed to the repo. A single shared key means future APK releases
# install *over* the previous one instead of requiring an uninstall.
on:
  workflow_dispatch:
  push:
    branches: [arena/448d7fd5-gesto-ai]
    paths: ['.github/workflows/gen-debug-key.yml']

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          base64 -w0 debug.keystore > b64.txt
          echo "bytes: $(wc -c < debug.keystore) | base64: $(wc -c < b64.txt)"
          split -b 1500 -d b64.txt chunk-
          for f in chunk-*; do
            echo "::notice::KEYCHUNK:$(cat "$f")"
          done
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1|SHA256|Alias" | head -4
